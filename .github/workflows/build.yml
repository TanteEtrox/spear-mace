name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Mod bauen
        working-directory: spear-mace-mod
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: spear-mace-jar
          path: |
            spear-mace-mod/build/libs/*.jar
            !spear-mace-mod/build/libs/*-sources.jar
            
